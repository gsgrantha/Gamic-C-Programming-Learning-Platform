# Using MongoDB Atlas? Set MONGO_URI below to your Atlas string and delete the "mongo" service,
# its volume and "depends_on".
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/gamic
      JWT_SECRET: change-me-in-production
    depends_on: [mongo]
volumes:
  mongo-data:
